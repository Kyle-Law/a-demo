# Model-aware routing, step 2 (C2): only model A runs here (the cross-cluster replica of C1's
# model A). Other model names match no rule and get a 404 from this gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: models
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: inference-gateway}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1/}
          headers:
            - {type: Exact, name: X-Gateway-Base-Model-Name, value: model-a}
      backendRefs:
        - {group: inference.networking.k8s.io, kind: InferencePool, name: model-a}
      timeouts:
        request: 300s
