# The inference gateway on a fixed NodePort for callers in other clusters, over the WireGuard mesh:
# http://<control-plane wg IP>:30080 (172.30.1.10 for C1, 172.30.2.10 for C2). The ops agent on
# C3 uses it for intellect-3 and model-a (agent/ops-agent/deploy). ufw keeps NodePorts off the
# public interfaces. Replaced by the Cilium global Service in front of the gateways in B9.
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway-mesh
spec:
  type: NodePort
  selector:
    gateway.networking.k8s.io/gateway-name: inference-gateway # set by agentgateway on its proxy pods
  ports:
    - name: http
      port: 80
      targetPort: 80 # agentgateway listens on the listener port
      nodePort: 30080
