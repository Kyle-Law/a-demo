# The inference Gateway in this cluster (CLAUDE.md decision 1: one Gateway per GPU cluster).
# ClusterIP, not LoadBalancer: there is no cloud load balancer. Clients reach it in-cluster;
# B9 puts a Cilium global Service in front of the C1 and C2 gateways.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: inference-gateway
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: inference-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: inference-gateway
spec:
  service:
    spec:
      type: ClusterIP
