# C1: A100 80GB in MIG layout a-demo-c1 (3x 2g.20gb + 1x 1g.20gb) and the MI300X.
# Synced by clusters/c1/models.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inference
resources:
  - namespace.yaml
  - ../model-a
  - ../model-b
  - ../embed
  - ../rerank
  - ../intellect-3
labels:
  - pairs: {cluster: c1, tenant: shared} # CLAUDE.md contract: every pod carries cluster/tenant/model
    includeTemplates: true
patches:
  # Two replicas of model A on two 2g.20gb slices; model B takes the third.
  - target: {kind: Deployment, name: model-a-vllm}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 2}
      - {op: add, path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1mig-2g.20gb, value: 1}
  - target: {kind: Deployment, name: model-b-vllm}
    patch: |-
      - {op: add, path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1mig-2g.20gb, value: 1}
  # embed and rerank time-slice the single 1g.20gb slice (".shared": two replicas advertised).
  - target: {kind: Deployment, name: (embed|rerank)-vllm}
    patch: |-
      - {op: add, path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1mig-1g.20gb.shared, value: 1}
  - target: {kind: Deployment, name: intellect-3-vllm}
    patch: |-
      - {op: add, path: /spec/template/spec/containers/0/resources/limits/amd.com~1gpu, value: 1}
