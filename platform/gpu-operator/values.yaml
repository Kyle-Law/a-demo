# NVIDIA GPU Operator on the GPU clusters (C1: A100 MIG, C2: A6000).
# Chart gpu-operator v26.7.2, pinned in clusters/c1/gpu-operator.yaml and clusters/c2/gpu-operator.yaml.

# Provider images (Massed Compute) ship the driver (580.x); the operator must not install another.
driver:
  enabled: false

# MIG slices are advertised per profile (nvidia.com/mig-2g.20gb, nvidia.com/mig-1g.20gb).
# Non-MIG GPUs (A6000) keep advertising nvidia.com/gpu.
mig:
  strategy: mixed

migManager:
  # MIG *mode* is turned on by infra/ansible (roles/nvidia_mig, host var mig_enabled), because
  # the GPU reset it needs fails on these VMs and WITH_REBOOT=true leaves the node NotReady
  # (see that role). mig-manager only creates and switches slices, which needs no reset.
  # A layout that turns MIG off (all-disabled) therefore fails here with mig.config.state=failed.
  config:
    create: true
    name: a-demo-mig-parted-config
    # The ClusterPolicy CRD only accepts "all-disabled" or "" here. A node picks a layout through
    # its nvidia.com/mig.config label, which manifests/mig-layout.yaml sets from the GPU's PCI ID.
    default: all-disabled
    data:
      config.yaml: |-
        version: v1
        mig-configs:
          all-disabled:
            - devices: all
              mig-enabled: false
          # CLAUDE.md "C1 accelerator layout" (nvidia-smi mig -cgi 14,14,14,15):
          # 3x 2g.20gb (model A x2, model B) + 1x 1g.20gb (embedding + reranker).
          a-demo-c1:
            - devices: all
              mig-enabled: true
              mig-devices:
                "2g.20gb": 3
                "1g.20gb": 1
