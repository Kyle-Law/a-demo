# NVIDIA GPU Operator v26.7.2 in DRA mode (GPUCluster), CLAUDE.md decision 10.
# Provider images already ship NVIDIA driver 580 and nvidia-container-toolkit 1.18, so the
# operator only runs NFD, the DRA driver, DCGM and dcgm-exporter. MIG slices are created on
# the host before kubelet starts (infra/ansible/roles/nvidia_mig), since GPUCluster has no MIG Manager.

# Device-plugin stack off. ClusterPolicy and GPUCluster cannot coexist, and switching later
# is not supported in place.
clusterPolicy:
  deployCR: false
gpuCluster:
  deployCR: true

# Driver is pre-installed on the host: no containerized driver, no NVIDIADriver CR.
driver:
  enabled: false
hostPaths:
  driverInstallDir: /

draDriver:
  computeDomains:
    enabled: false # Multi-Node NVLink only; no NVLink domains here

dcgmExporter:
  # Attach the labels contract (cluster, tenant, model) from the consuming pod to GPU metrics;
  # the allowlist keeps Prometheus cardinality bounded.
  enablePodLabels: true
  podLabelAllowlistRegex: ["^cluster$", "^tenant$", "^model$"]
  serviceMonitor:
    enabled: false # B2 installs the Prometheus Operator CRDs
