# B3 "done when": one CUDA test pod on each MIG slice of the C1 A100 (3x 2g.20gb + 1x 1g.20gb).
# Not synced by Argo CD. Run by hand, then clean up:
#   kubectl --context c1 apply -f platform/gpu-operator/tests/smoke.yaml
#   kubectl --context c1 -n gpu-smoke get pods     # expect 4x Completed
#   kubectl --context c1 -n gpu-smoke logs -l app=gpu-smoke --prefix
#   kubectl --context c1 delete -f platform/gpu-operator/tests/smoke.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-smoke
---
apiVersion: v1
kind: Pod
metadata:
  name: mig-2g-a
  namespace: gpu-smoke
  labels: {app: gpu-smoke}
spec:
  restartPolicy: Never
  containers:
    - name: cuda
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
      command: ["sh", "-c", "nvidia-smi -L && /cuda-samples/vectorAdd"]
      resources:
        limits: {nvidia.com/mig-2g.20gb: 1}
---
