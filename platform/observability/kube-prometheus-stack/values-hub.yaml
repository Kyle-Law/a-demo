# The hub on C3: full Prometheus that also receives the agents' remote-write, Alertmanager (B13
# sends alerts to Jira), and Grafana. Storage is emptyDir for now, so metrics are lost when the
# Prometheus pod restarts. A StorageClass comes with Vault in B15.

prometheus:
  service:
    # Remote-write target for the C1/C2 agents, reached over the WireGuard mesh at
    # http://172.30.3.10:30090/api/v1/write (NodePorts are reachable on wg0 only; ufw blocks them
    # on public interfaces).
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    enableRemoteWriteReceiver: true
    retention: 7d

defaultRules:
  # Every series carries cluster, so evaluate the default alert rules per cluster instead of
  # mixing C1, C2 and C3 together.
  additionalAggregationLabels: [cluster]

grafana:
  admin:
    # Created once by infra/ansible/gitops.yml (random password, never in Git).
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      multicluster:
        global:
          enabled: true # adds a cluster selector to the default dashboards (B2 "done when")
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy

alertmanager:
  # B13: alerts labelled ticket="true" go to the Jira bridge (agent/alert-bridge), everything else
  # to "null" (visible in Alertmanager and Grafana, but no ticket). Lists here replace the chart
  # defaults, so the full set is restated.
  config:
    route:
      # One notification group per affected resource: the alert -> ticket contract key.
      group_by: [cluster, namespace, resource]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "null"
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
        - receiver: jira-bridge
          matchers: ['ticket = "true"']
    receivers:
      - name: "null"
      - name: jira-bridge
        webhook_configs:
          - url: http://alert-bridge.ops.svc:8080/alertmanager
            send_resolved: true
    # The chart's defaults with cluster added: without it, a critical alert in one cluster would
    # inhibit the same warning in another, because every cluster's alerts meet here.
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: [cluster, namespace, alertname]
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: [cluster, namespace, alertname]
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: [cluster, namespace]
      - target_matchers: ['alertname = InfoInhibitor']
      # B13 "one fault, one ticket": a NotReady node also takes its pods down, which would open
      # ModelServerDown / PodUnschedulable tickets for the same fault. The node ticket is the
      # root cause, so it silences those for the whole cluster while it fires.
      - source_matchers: ['signal = NodeNotReady']
        target_matchers: ['signal =~ "ModelServerDown|PodUnschedulable"']
        equal: [cluster]
