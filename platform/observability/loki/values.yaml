# Loki 7.5.0 (app 3.6.16) on C3, single binary with filesystem storage: logs from every cluster
# are pushed here by Grafana Alloy (B2 part 2). Data lives on a local-path volume (C3's default
# StorageClass, B15), which pins Loki to the node that holds it.
deploymentMode: SingleBinary

loki:
  auth_enabled: false # single tenant; the cluster label separates clusters
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  # Loki writes under /var/loki; without a volume there the chart mounts nothing and Loki fails on
  # the read-only root filesystem (seen on the first C3 bring-up, 2026-10-27).
  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi

# Single-binary mode: none of the scalable components, caches, gateway, canary or MinIO.
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}
