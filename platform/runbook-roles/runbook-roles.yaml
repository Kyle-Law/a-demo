# B15: what each runbook required_role may do, one ClusterRole per role. Nothing binds them
# permanently: for each approved runbook run, Vault (platform/vault/runbook-roles.yaml) creates a
# ServiceAccount named runbook-*, binds it to one of these in one namespace with a RoleBinding, and
# hands the executor a token that expires in minutes. Synced to every cluster (clusters/all).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runbook-gitops-operator
rules:
  # Only the model Applications (runbook model-server-down); runbook-guard.yaml limits the change
  # to auto-sync and sync.
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [models-c1, models-c2]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runbook-inference-pod-janitor
rules:
  # get: the executor reads ownerReferences and refuses to delete a pod a controller owns.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runbook-inference-job-janitor
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, delete]
