# Vault on C3 (chart 0.34.1, Vault 2.0.4). Three Raft replicas, one per C3 node; each keeps its
# copy of the data on a local-path volume (clusters/c3/local-path-provisioner.yaml).
global:
  enabled: true

injector:
  enabled: false # the executor calls Vault's API itself; no sidecars to inject

server:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: local-path
  # File audit device (enabled by roles/vault_unseal): every token minted for a runbook is logged.
  auditStorage:
    enabled: true
    size: 2Gi
    storageClass: local-path

  # C3 has two workers. The chart's anti-affinity puts each replica on its own node, so the third
  # replica goes to the control plane.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      # TLS is off inside the cluster: pod traffic between C3's nodes runs over the WireGuard mesh
      # (CLAUDE.md decision 9), and nothing outside C3 talks to Vault. B6's default-deny will limit
      # who can reach port 8200.
      config: |
        ui = true
        disable_mlock = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }

        storage "raft" {
          path = "/vault/data"
          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-2.vault-internal:8200"
          }
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }

ui:
  enabled: false

# Scraped by the hub Prometheus (Raft, token and lease metrics of the unsealed replicas).
serverTelemetry:
  serviceMonitor:
    enabled: true
