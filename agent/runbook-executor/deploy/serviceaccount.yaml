# The executor's identity (CLAUDE.md decision 6: execute is its own identity, separate from the
# ops agent's read-only ones). No Role or RoleBinding on purpose: its only use is to log in to
# Vault (auth/kubernetes/role/runbook-executor, platform/vault/runbook-roles.yaml), which mints
# short-lived, runbook-scoped tokens per run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runbook-executor
automountServiceAccountToken: false
