[defaults]
# Directory inventory: hosts.yml, then git-ignored local.yml (later files win).
inventory = inventory
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
forks = 10

[ssh_connection]
pipelining = True
# Hosts are re-provisioned by hand and come back with new host keys; trust on first use.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
