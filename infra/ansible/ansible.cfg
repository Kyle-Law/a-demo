[defaults]
# Directory inventory: hosts.yml, then git-ignored local.yml (later files win).
inventory = inventory
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
forks = 10

[ssh_connection]
pipelining = True
# Hosts are re-provisioned by hand and come back with new host keys; trust on first use.
# Keepalives: hosts sit on different continents, and a silently dropped connection
# otherwise hangs the play forever instead of failing that host.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=4
# ...and a dropped connection is retried instead of failing the host.
retries = 3
