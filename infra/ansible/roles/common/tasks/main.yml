- name: Require admin_cidrs so the API server is not left open to the internet
  ansible.builtin.assert:
    that: admin_cidrs | default([]) | length > 0
    fail_msg: Set admin_cidrs in inventory/local.yml to the IP(s) you run kubectl from (see README).
  run_once: true

- name: Require a supported OS
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version in ["22.04", "24.04"]
      - ansible_architecture == "x86_64"
    fail_msg: "Expected Ubuntu 22.04/24.04 x86_64, got {{ ansible_distribution }} {{ ansible_distribution_version }} {{ ansible_architecture }}"

- name: Detect whether this host is a container
  ansible.builtin.command: systemd-detect-virt --container
  register: common_container
  changed_when: false
  failed_when: false

- name: Require a VM or bare metal (kubeadm, WireGuard and GPU drivers need the host kernel)
  ansible.builtin.assert:
    that: common_container.rc != 0
    fail_msg: "Host is a {{ common_container.stdout }} container; re-provision it as a VM or bare-metal instance."

- name: Read cgroup filesystem type
  ansible.builtin.command: stat -fc %T /sys/fs/cgroup
  register: common_cgroupfs
  changed_when: false

- name: Require cgroup v2 (kubelet 1.35+ refuses cgroup v1)
  ansible.builtin.assert:
    that: common_cgroupfs.stdout == "cgroup2fs"
    fail_msg: "/sys/fs/cgroup is {{ common_cgroupfs.stdout }}, expected cgroup2fs"

- name: Gather installed packages
  ansible.builtin.package_facts:

- name: Refuse to replace distro container runtimes
  ansible.builtin.assert:
    that:
      - "'containerd' not in ansible_facts.packages"
      - "'docker.io' not in ansible_facts.packages"
    fail_msg: >-
      Ubuntu's containerd/docker.io packages conflict with containerd.io. Remove them by hand
      (check nothing on the host depends on them first), then re-run.

- name: Install base packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, gpg, jq, chrony, conntrack, socat]
    update_cache: true
    cache_valid_time: 3600

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Disable unattended upgrades
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    state: stopped
    enabled: false
  when:
    - disable_unattended_upgrades
    - "'unattended-upgrades' in ansible_facts.packages"

- name: Turn swap off
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Keep swap off across reboots
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
  loop: [overlay, br_netfilter]

- name: Set kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-k8s.conf
    reload: true
  loop: "{{ sysctls | dict2items }}"
  vars:
    sysctls:
      net.ipv4.ip_forward: 1
      net.bridge.bridge-nf-call-iptables: 1
      net.bridge.bridge-nf-call-ip6tables: 1
      fs.inotify.max_user_instances: 8192
      fs.inotify.max_user_watches: 524288
