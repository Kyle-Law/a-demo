# The ops agent's read-only identity on this cluster (B14; CLAUDE.md decision 6: read and execute
# are separate identities, and the agent never holds write credentials). get/list/watch only, and
# never Secrets: core resources are listed one by one instead of "*" for that reason.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-agent-reader
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ops-agent-read
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, nodes, events, services, endpoints, configmaps, namespaces,
                persistentvolumeclaims, persistentvolumes, serviceaccounts, resourcequotas, limitranges,
                replicationcontrollers]
    verbs: [get, list, watch]
  - apiGroups: [apps, batch, autoscaling, policy, networking.k8s.io, storage.k8s.io, events.k8s.io,
                discovery.k8s.io, apiextensions.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
  # DRA (GPUs), inference routing, GitOps, monitoring and GPU operators: what an RCA here touches.
  - apiGroups: [resource.k8s.io, gateway.networking.k8s.io, inference.networking.k8s.io,
                agentgateway.dev, argoproj.io, monitoring.coreos.com, nvidia.com, nfd.k8s-sigs.io,
                cilium.io]
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ops-agent-read
subjects:
  - kind: ServiceAccount
    name: ops-agent-reader
    namespace: kube-system
---
# Long-lived token, like argocd-manager's; rotate by deleting it and re-running gitops.yml.
apiVersion: v1
kind: Secret
metadata:
  name: ops-agent-reader-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: ops-agent-reader
type: kubernetes.io/service-account-token
