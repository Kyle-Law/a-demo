- name: Render kubeadm init config
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes/kubeadm-init.yaml
    mode: "0600"

- name: Initialize the control plane (skipped once admin.conf exists)
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-init.yaml
  args:
    creates: /etc/kubernetes/admin.conf

- name: Read admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/kubernetes/admin.conf
  register: control_plane_admin_conf
  no_log: true

- name: Record the public API endpoint for the controller-side kubeconfig
  ansible.builtin.set_fact:
    control_plane_public_ip: "{{ ansible_host }}"

- name: Create kubeconfig directory on the controller
  ansible.builtin.file:
    path: "{{ kubeconfig_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Write kubeconfig with context {{ cluster_name }} on the controller
  ansible.builtin.template:
    src: kubeconfig.yaml.j2
    dest: "{{ kubeconfig_dir }}/{{ cluster_name }}.yaml"
    mode: "0600"
  delegate_to: localhost
  become: false
  diff: false
