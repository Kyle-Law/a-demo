# Turning MIG mode on needs a GPU reset. On Massed Compute VMs the reset always fails
# ("In use by another client"), so MIG mode is turned on here, with a real reboot, before the
# node joins. GPU Operator runs in DRA mode (GPUCluster), which has no mig-manager, and the DRA
# driver only discovers slices that exist when it starts; so the slices are created here too,
# by a unit that runs at every boot before kubelet (MIG instances don't survive a reboot).

- name: Read MIG mode (current, pending)
  ansible.builtin.command: nvidia-smi --query-gpu=mig.mode.current,mig.mode.pending --format=csv,noheader
  register: nvidia_mig_mode
  changed_when: false

- name: Turn MIG mode on (takes effect after a reset or reboot)
  ansible.builtin.command: nvidia-smi -mig 1
  when: nvidia_mig_mode.stdout_lines | map('split', ', ') | map('last') | unique != ['Enabled']
  changed_when: true

- name: Reboot to apply MIG mode
  ansible.builtin.reboot:
    reboot_timeout: 900
  when: nvidia_mig_mode.stdout_lines | map('split', ', ') | map('first') | unique != ['Enabled']

- name: Read MIG mode after reboot
  ansible.builtin.command: nvidia-smi --query-gpu=mig.mode.current --format=csv,noheader
  register: nvidia_mig_mode_after
  changed_when: false

- name: Require MIG mode on for every GPU
  ansible.builtin.assert:
    that: nvidia_mig_mode_after.stdout_lines | unique == ['Enabled']
    fail_msg: "MIG mode is {{ nvidia_mig_mode_after.stdout_lines }} after reboot"

- name: Install the MIG layout script ({{ mig_layout }})
  ansible.builtin.template:
    src: a-demo-mig-layout.sh.j2
    dest: /usr/local/sbin/a-demo-mig-layout
    mode: "0755"

- name: Install the MIG layout unit
  ansible.builtin.copy:
    src: a-demo-mig-layout.service
    dest: /etc/systemd/system/a-demo-mig-layout.service
    mode: "0644"

- name: Create the slices now and at every boot, before kubelet
  ansible.builtin.systemd_service:
    name: a-demo-mig-layout
    enabled: true
    state: started
    daemon_reload: true
