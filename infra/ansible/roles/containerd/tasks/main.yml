- name: Add Docker apt key (source of containerd.io)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc

- name: Install containerd.io
  ansible.builtin.apt:
    name: "containerd.io={{ containerd_version }}*"
    update_cache: true
    allow_downgrade: true

- name: Hold containerd.io
  ansible.builtin.dpkg_selections:
    name: containerd.io
    selection: hold

# The config is written once. GPU Operator / AMD GPU Operator add their runtimes afterwards,
# and re-running B0 must not clobber that.
- name: Check whether config.toml was already written by this role
  ansible.builtin.command: "grep -q '^# managed-by: a-demo' /etc/containerd/config.toml"
  register: containerd_managed
  changed_when: false
  failed_when: false

- name: Generate default containerd config
  ansible.builtin.command: containerd config default
  register: containerd_default
  changed_when: false
  when: containerd_managed.rc != 0

- name: Write containerd config with the systemd cgroup driver
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    mode: "0644"
    content: |
      # managed-by: a-demo ansible (written once; GPU operators may extend it)
      {{ containerd_default.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}
  when: containerd_managed.rc != 0
  notify: Restart containerd

- name: Confirm the systemd cgroup driver is set
  ansible.builtin.command: grep -q 'SystemdCgroup = true' /etc/containerd/config.toml
  changed_when: false

- name: Point crictl at containerd
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    mode: "0644"
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock

- name: Start containerd
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started

- name: Apply config changes before kubeadm runs
  ansible.builtin.meta: flush_handlers
