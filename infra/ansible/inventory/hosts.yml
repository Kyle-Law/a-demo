# Hosts are provisioned by hand (Prime Intellect: CPU, A100, A6000; HotAisle: MI300X).
# Real public IPs, SSH users and admin_cidrs go in inventory/local.yml (git-ignored, see README):
# this repo is public.
#
# wg_ip is the node's fixed address on the WireGuard mesh and becomes its Kubernetes node IP.
# Never change a wg_ip after the node has joined; to reuse a slot on a new machine, rebuild the node.
# If a host's public IP is not the address peers should use for WireGuard, set wg_endpoint.
#
# 203.0.113.0/24 (TEST-NET-3) addresses are placeholders.
all:
  children:
    control_plane:
      hosts:
        c1-cp:
          ansible_host: 203.0.113.11 # TODO: Prime Intellect CPU
          wg_ip: 172.30.1.10
        c2-cp:
          ansible_host: 203.0.113.21 # TODO: Prime Intellect CPU
          wg_ip: 172.30.2.10
        c3-cp:
          ansible_host: 203.0.113.31 # TODO: Prime Intellect CPU
          wg_ip: 172.30.3.10
    workers:
      hosts:
        c1-a100:
          ansible_host: 203.0.113.12 # TODO: Prime Intellect A100 80GB
          wg_ip: 172.30.1.11
        c1-mi300x:
          ansible_host: 203.0.113.13 # TODO: HotAisle MI300X
          wg_ip: 172.30.1.12
        c2-a6000:
          ansible_host: 203.0.113.22 # TODO: Prime Intellect A6000
          wg_ip: 172.30.2.11
        c3-w1:
          ansible_host: 203.0.113.32 # TODO: Prime Intellect CPU
          wg_ip: 172.30.3.11
        c3-w2:
          ansible_host: 203.0.113.33 # TODO: Prime Intellect CPU
          wg_ip: 172.30.3.12
    c1:
      hosts:
        c1-cp:
        c1-a100:
        c1-mi300x:
    c2:
      hosts:
        c2-cp:
        c2-a6000:
    c3:
      hosts:
        c3-cp:
        c3-w1:
        c3-w2:
  vars:
    ansible_user: root # TODO: confirm per provider; override per host if they differ
