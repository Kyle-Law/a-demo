# Versions, checked 2026-10-27. Kubernetes is 1.36 because Cilium 1.20 supports 1.33-1.36
# and GPU Operator v26.7 supports 1.33-1.37.
kubernetes_minor: "1.36"
kubernetes_version: "1.36.5"
kubernetes_package_version: "1.36.5-1.1"
containerd_version: "2.4.2" # default sandbox image pause:3.10.2 matches kubeadm 1.36
helm_version: v3.22.1
cilium_version: "1.20.4"
cilium_cli_version: v0.20.1
argocd_chart_version: "10.11.6" # Argo CD v3.5.6; keep equal to clusters/c3/argocd.yaml

repo_root: "{{ playbook_dir }}/../.."

cluster_names: [c1, c2, c3]
control_plane_host: "{{ groups[cluster_name] | intersect(groups['control_plane']) | first }}"
kube_context: "kubernetes-admin@{{ cluster_name }}" # context name inside admin.conf on the control plane

# Host-level WireGuard mesh spanning every node of every cluster, across providers.
# Each host's wg_ip (inventory) is its Kubernetes node IP.
wireguard_port: 51820
wireguard_network: 172.30.0.0/16
wireguard_mtu: 1420 # keep equal to MTU in platform/cilium/values.yaml

# Cilium Helm values; also the source of truth for pod CIDRs (firewall reads them).
cilium_values_dir: "{{ playbook_dir }}/../../platform/cilium"

# Source CIDRs allowed to reach kube-apiserver on control-plane public IPs.
admin_cidrs: [] # TODO: your egress IP(s), e.g. ["198.51.100.7/32"]

# Ports sshd listens on (on the host, not a provider-side NAT port).
firewall_ssh_ports: [22]

# Kernel or driver upgrades in the middle of a demo break GPU nodes.
disable_unattended_upgrades: true

# Admin kubeconfigs are written here on the controller, outside the repo.
kubeconfig_dir: "{{ lookup('env', 'HOME') }}/.kube/a-demo"
