# B1: Argo CD on C3, managing C1, C2 and itself. Run after site.yml.
# Only spokes reachable in this run get registered; re-run once C1 exists.

- name: Create Argo CD credentials on spoke clusters
  hosts: control_plane:!c3
  become: true
  roles:
    - argocd_spoke

- name: Read-only identity for the ops agent on every cluster (B14)
  hosts: control_plane
  become: true
  roles:
    - ops_agent_reader

- name: Install Argo CD on the hub and hand over to Git
  hosts: control_plane:&c3
  become: true
  roles:
    - argocd_hub
    - grafana_admin # B2: Grafana's admin Secret, before Argo CD syncs the hub's monitoring stack
    - jira_credentials # B13: the alert bridge's Jira Secret, from the git-ignored .jira.env
    - ops_agent_secrets # B14: the agent's read-only kubeconfigs and optional Anthropic key

# B15: the identity Vault's Kubernetes secrets engine uses on each cluster (tagged vault, so
# --tags vault also refreshes the engines).
- name: Vault's token minter on every cluster
  hosts: control_plane
  become: true
  roles:
    - role: vault_minter
      tags: [vault]

# B15: Vault starts sealed. Waits for Argo CD to start it, initializes it once (keys to the
# git-ignored .vault-init.json on the controller) and unseals every replica. After a Vault pod
# restarts: ansible-playbook gitops.yml --tags vault
- name: Initialize and unseal Vault on the hub
  hosts: control_plane:&c3
  become: true
  roles:
    - role: vault_unseal
      tags: [vault]
    - role: vault_config # Kubernetes auth, executor policy, secrets engines (platform/vault/runbook-roles.yaml)
      tags: [vault]
