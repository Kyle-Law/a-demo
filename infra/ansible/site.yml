# B0: OS prep, WireGuard mesh, containerd, kubeadm, Cilium.
# First bring-up of a single cluster: ansible-playbook site.yml --limit c2
# Once more than one cluster exists, run without --limit so every node's mesh config lists every peer.

- name: Prepare hosts
  hosts: all
  become: true
  roles:
    - common
    - wireguard
    - firewall
    - containerd
    - kubernetes
    - role: nvidia_mig # reboots the host the first time
      when: mig_layout is defined

- name: Initialize control planes
  hosts: control_plane
  become: true
  roles:
    - control_plane

- name: Join workers
  hosts: workers
  become: true
  roles:
    - worker

- name: Install Cilium and verify
  hosts: control_plane
  become: true
  roles:
    - cilium
