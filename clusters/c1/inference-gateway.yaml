# B8: the inference Gateway, model-routing policy and HTTPRoute on C1 (inference/gateways/c1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference-gateway-c1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kyle-Law/a-demo.git
    targetRevision: main
    path: inference/gateways/c1
  destination:
    name: c1
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true # CRDs come from gateway-api-crds-c1 and agentgateway-c1
