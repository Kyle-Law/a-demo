# B13: the Alertmanager -> Jira bridge on C3 (agent/alert-bridge).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alert-bridge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kyle-Law/a-demo.git
    targetRevision: main
    path: agent/alert-bridge
  destination:
    server: https://kubernetes.default.svc
    namespace: ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
