# B15: the runbook executor on C3 (agent/runbook-executor/deploy).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runbook-executor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kyle-Law/a-demo.git
    targetRevision: main
    path: agent/runbook-executor/deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
