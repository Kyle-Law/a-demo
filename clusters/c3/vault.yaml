# B15: Vault on C3, the source of the executor's short-lived, runbook-scoped Kubernetes tokens
# (CLAUDE.md decisions 6 and 8). Raft storage on local-path volumes; infra/ansible initializes and
# unseals it (roles/vault_unseal), and the unseal keys never reach Git. See platform/vault/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: 0.34.1 # Vault 2.0.4
      helm:
        releaseName: vault
        valueFiles:
          - $values/platform/vault/values.yaml
    - repoURL: https://github.com/Kyle-Law/a-demo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
