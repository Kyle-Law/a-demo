# B8: the inference Gateway, model-routing policy and HTTPRoute on C2 (inference/gateways/c2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference-gateway-c2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kyle-Law/a-demo.git
    targetRevision: main
    path: inference/gateways/c2
  destination:
    name: c2
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true # CRDs come from gateway-api-crds-c2 and agentgateway-c2
