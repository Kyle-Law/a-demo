# B7: vLLM model servers on C2 (A6000).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: models-c2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kyle-Law/a-demo.git
    targetRevision: main
    path: inference/models/c2
  destination:
    name: c2
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
