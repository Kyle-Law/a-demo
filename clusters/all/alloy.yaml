# B2: Grafana Alloy on every fleet cluster, pushing pod logs to Loki on C3.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: alloy
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            a-demo.io/fleet: "true"
  template:
    metadata:
      name: "alloy-{{ .name }}"
    spec:
      project: default
      sources:
        - repoURL: https://grafana.github.io/helm-charts
          chart: alloy
          targetRevision: 1.14.3
          helm:
            releaseName: alloy
            valueFiles:
              - $values/platform/observability/alloy/values.yaml
            valuesObject:
              alloy:
                extraEnv:
                  - name: CLUSTER
                    value: "{{ .name }}"
        - repoURL: https://github.com/Kyle-Law/a-demo.git
          targetRevision: main
          ref: values
      destination:
        name: "{{ .name }}"
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
